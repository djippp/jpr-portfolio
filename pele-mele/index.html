<style>
  /* Layout: a 7000 × 4900 white board, panned and zoomed like a design canvas. The 1-bit « pêle-mêle »
     title is the centre of the board, blown up raw; a handful of fragments sit around it, untouched,
     with Figma-style file labels. Nav and HUD invert over whatever passes under them. Single light look. */
  /* PP Mori, fournie avec la page (dossier fonts/) */
  @font-face { font-family: "PP Mori"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/PPMori-Regular.woff2") format("woff2"); }
  @font-face { font-family: "PP Mori"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/PPMori-Semibold.woff2") format("woff2"); }
  @font-face { font-family: "PP Mori"; font-weight: 600; font-style: normal; font-display: swap; src: url("fonts/PPMori-Semibold.woff2") format("woff2"); }
  :root {
    --paper: #F2F0EB;   /* 6 nov. : blanc cassé, le même ton que le texte des pages noires */
    --ink: #000;
    --grot: "PP Mori", "Host Grotesk", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); font-family: var(--grot);
    overflow: hidden; overscroll-behavior: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }


  /* ---------- menu : le même que sur l'accueil, au pixel près (tracés de la maquette 1600 px, même colonne) ---------- */
  .jnav, .jlogo { position: fixed; z-index: 6000; top: 0; left: 0; right: 0; pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .jnav { mix-blend-mode: difference; }
  .jnav-in { position: relative; max-width: 1600px; margin: 0 auto; }
  .jnav svg { display: block; width: 100%; height: auto; aspect-ratio: 1600 / 84; }
  .jnav a, .jlogo a { position: absolute; display: block; pointer-events: auto; border-radius: 4px; }
  .jnav a:focus-visible { outline: 2px solid #F2F0EB; outline-offset: 4px; }

  /* ---------- le tableau : blanc, rien d'autre ---------- */
  .viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; background: var(--paper); }
  .viewport.dragging { cursor: grabbing; }
  .viewport:focus-visible { outline: none; }
  .board { position: absolute; left: 0; top: 0; width: 7000px; height: 4900px; transform-origin: 0 0; will-change: transform; }

  .it { position: absolute; left: var(--x); top: var(--y); width: var(--w); margin: 0; }
  .it img { display: block; width: 100%; height: auto; max-width: none; user-select: none; -webkit-user-drag: none; }
  .px img { image-rendering: pixelated; }
  /* sélection façon outil de design : un filet noir, rien de plus */
  .it:hover { outline: calc(1px / var(--z, 1)) solid var(--ink); }
  /* étiquette de fichier au-dessus de chaque élément, toujours à la même taille à l'écran */
  .lbl {
    position: absolute; left: 0; right: 0; bottom: 100%; padding-bottom: calc(6px / var(--z, 1));
    display: flex; justify-content: space-between; gap: 1em; white-space: nowrap;
    font: 400 calc(12px / var(--z, 1))/1 var(--grot); color: var(--ink); font-variant-numeric: tabular-nums;
  }
  .lbl i { font-style: normal; opacity: .45; }

  /* le titre : le gif 1 bit, en énorme, sans écran autour */
  .hero { cursor: inherit; }
  /* 6 nov. : le gif en multiply : son blanc prend le blanc cassé du fond, le noir reste noir.
     Le tableau reçoit la couleur du fond, sinon le mélange se ferait sur du transparent (le tableau est son propre calque). */
  .hero img { mix-blend-mode: multiply; }
  .board { background: var(--paper); }

  /* emplacement photo à venir */
  .slotph { aspect-ratio: 4 / 3; border: 3px solid var(--ink); display: grid; place-items: center; font: 400 30px/1.2 var(--grot); text-align: center; }

  /* petit piano jouable, noir et blanc */
  .keys { position: relative; display: flex; height: 220px; touch-action: none; border: 3px solid var(--ink); }
  .keys button { font: inherit; cursor: pointer; padding: 0; margin: 0; }
  .white { flex: 1; background: #F2F0EB; border: 0; border-left: 3px solid var(--ink); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 14px !important; font: 400 22px/1 var(--grot) !important; color: var(--ink); }
  .white:first-child { border-left: 0; }
  .black { position: absolute; top: 0; width: 7%; height: 60%; background: var(--ink); border: 0; z-index: 2; }
  .white.on { background: var(--ink); color: #F2F0EB; } .black.on { background: #F2F0EB; outline: 1px solid var(--ink); outline-offset: -1px; }
  .keys button:focus-visible { outline: 2px solid var(--ink); outline-offset: -5px; }
  .black:focus-visible { outline-color: #F2F0EB; }

  .txt { font: 400 34px/1.15 var(--grot); letter-spacing: -.01em; margin: 0; }

  /* ---------- interface : du texte, inversé lui aussi ---------- */
  .hud {
    position: fixed; z-index: 20; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 18px; align-items: baseline; font: 400 13px/1 var(--grot); color: #F2F0EB; mix-blend-mode: difference;
    font-variant-numeric: tabular-nums;
  }
  .hud.l { left: max(28px, env(safe-area-inset-left, 0px)); }
  .hud.r { right: max(28px, env(safe-area-inset-right, 0px)); gap: 4px; }
  /* 7 nov. : mobile, sur les marges de 16 px : la ligne de base des repères à 16 px du bas (les boutons gardent leur zone de toucher) */
  @media (max-width: 700px) { .hud { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); } .hud.l { left: max(16px, env(safe-area-inset-left, 0px)); } .hud.r { right: max(9px, env(safe-area-inset-right, 0px)); } .hud.r button { padding: 12px 7px 0; } }
  .hud button { font: inherit; color: inherit; background: none; border: 0; padding: 6px 7px; cursor: pointer; }
  .hud button:hover { text-decoration: underline; text-underline-offset: 4px; }
  .hud button:focus-visible { outline: 1px solid currentColor; }
  @media (max-width: 640px) {
    .hud.l .hint { display: none; }
  }
</style>

<script>
(() => {
  const BW = 7000, BH = 4900, HERO = { x: 3500, y: 2450 };
  const vp = document.getElementById('vp'), board = document.getElementById('board');
  const coords = document.getElementById('coords'), zReset = document.getElementById('zReset');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // caméra : coin haut-gauche de l'écran, en coordonnées du tableau, et zoom
  const cam = { x: 0, y: 0, z: 1 };
  let vx = 0, vy = 0, anim = null;
  const clampZ = (z) => Math.max(0.15, Math.min(3, z));
  const clampCam = () => {
    const w = innerWidth / cam.z, h = innerHeight / cam.z, m = 300;
    cam.x = Math.max(-m - Math.max(0, w - BW) / 2, Math.min(BW - w + m, cam.x));
    cam.y = Math.max(-m - Math.max(0, h - BH) / 2, Math.min(BH - h + m, cam.y));
  };
  const render = () => {
    clampCam();
    board.style.transform = `scale(${cam.z}) translate(${-cam.x}px, ${-cam.y}px)`;
    vp.style.setProperty('--z', cam.z);
    const cx = Math.round(cam.x + innerWidth / cam.z / 2), cy = Math.round(cam.y + innerHeight / cam.z / 2);
    coords.textContent = `x ${cx}  y ${cy}`;
    zReset.textContent = Math.round(cam.z * 100) + ' %';
  };
  const zoomAt = (z, sx, sy) => {   // zoome en gardant le point (sx, sy) de l'écran immobile
    const nz = clampZ(z), bx = cam.x + sx / cam.z, by = cam.y + sy / cam.z;

  @media (max-width: 700px) { :root { --mcol: calc((100vw - 32px - 48px) / 5); --mc: calc(var(--mcol) + 12px); } }

  :root { --fw: min(100vw - 32px, 1600px); --fl: max(16px, (100vw - 1600px) / 2); }
  /* 8 nov. : sur iPhone, toucher un lien ou un bouton le couvrait d'un voile gris foncé (la surbrillance par défaut de Safari) :

  const root = document.documentElement;
  const OUT = 470, IN = 560, CELL = () => (innerWidth <= 700 ? 3 : 4);

  // ---------- la trame : une toile basse définition, agrandie sans lissage ----------
  const cv = document.createElement('canvas'); cv.className = 'pt-veil'; cv.setAttribute('aria-hidden', 'true');
  document.body.appendChild(cv);
  const g = cv.getContext('2d');
  const B8 = [0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21];
  let W = 0, H = 0, img = null, px = null, th = null;
  const rgba = (hex) => { const n = parseInt(hex.slice(1), 16); return (255 << 24) | ((n & 255) << 16) | (((n >> 8) & 255) << 8) | ((n >> 16) & 255); };
  // seuil de chaque case : la trame de Bayer, plus un léger balayage (dans le sens du trait, ou du haut vers le bas)
  const field = (mode) => {
    const c = CELL(); W = Math.ceil(innerWidth / c); H = Math.ceil(innerHeight / c);
    cv.width = W; cv.height = H; img = g.createImageData(W, H); px = new Uint32Array(img.data.buffer); th = new Float32Array(W * H);
    const cx = W / 2, cy = H / 2, dm = Math.hypot(cx, cy);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const b = B8[(x & 7) + ((y & 7) << 3)] / 64;
      const s = mode === 'right' ? x / W : mode === 'left' ? 1 - x / W : mode === 'center' ? 1 - Math.hypot(x - cx, y - cy) / dm : y / H;
      th[x + y * W] = .58 * b + .42 * s;
    }
  };
  const paint = (p, col, covering) => {
    for (let i = 0; i < th.length; i++) px[i] = (covering ? th[i] <= p : th[i] > p) ? col : 0;
    g.putImageData(img, 0, 0);
  };
  const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const run = (dur, f) => new Promise((done) => { let t0 = 0; const step = (now) => { if (!t0) t0 = now; const k = Math.min(1, (now - t0) / dur); f(k); if (k < 1) requestAnimationFrame(step); else done(); }; requestAnimationFrame(step); });

  // ---------- le trait : il glisse d'un mot du menu à l'autre, le bord avant part le premier, l'autre suit ----------
  const navSvg = () => document.querySelector('.jnav svg, .hnav svg');
  const word = (svg, k) => { const label = { portfolio: 'portfolio', 'pele-mele': 'pêle-mêle', info: 'info' }[k];
    return label && [...svg.querySelectorAll('text')].find((t) => t.textContent.trim() === label); };
  const slide = (to) => {
    const svg = navSvg(); if (!svg || innerWidth <= 700) return { dir: null, go: Promise.resolve() };
    let r = svg.querySelector('rect[height="2.4"]');
    const t = to === 'home' ? null : word(svg, to);
    let a0, b0;
    if (r) { a0 = +r.getAttribute('x'); b0 = a0 + +r.getAttribute('width'); }
    else {                                                  // accueil : pas encore de trait, il naît au centre du mot visé
      if (!t) return { dir: null, go: Promise.resolve() };
      const bb = t.getBBox(); a0 = b0 = bb.x + bb.width / 2;
      r = document.createElementNS('http://www.w3.org/2000/svg', 'rect'); r.setAttribute('y', 39.6); r.setAttribute('height', 2.4);
      r.setAttribute('fill', getComputedStyle(t).fill || '#F2F0EB'); r.setAttribute('x', a0); r.setAttribute('width', 0);
      const defs = svg.querySelector('defs'); svg.insertBefore(r, defs || null);
    }
    svg.insertBefore(r, svg.firstChild);                    // le trait passe sous le logo JPR plutôt que par-dessus
    let a1, b1;
    if (t) { const bb = t.getBBox(); a1 = bb.x; b1 = bb.x + bb.width; }
    else { a1 = b1 = (a0 + b0) / 2; }                       // vers l'accueil : le trait se referme sur lui-même
    const dir = !t ? 'center' : a1 > a0 ? 'right' : a1 < a0 ? 'left' : null;
    // 6 nov. : le trait n'est visible que sur le mot de départ et sur le mot d'arrivée ; entre les deux, il voyage caché.
    // On le voit sortir de l'un et entrer dans l'autre : le trajet, on l'imagine.
    const NS = 'http://www.w3.org/2000/svg', zones = [];
    if (b0 > a0) { const src = [...svg.querySelectorAll('text')].find((tx) => { const bb = tx.getBBox(); return a0 < bb.x + bb.width && b0 > bb.x; }); if (src) zones.push(src.getBBox()); }
    if (t) zones.push(t.getBBox());
    if (zones.length) {
      const old = svg.querySelector('#ptClip'); if (old) old.remove();
      const cp = document.createElementNS(NS, 'clipPath'); cp.id = 'ptClip';
      for (const bb of zones) { const z = document.createElementNS(NS, 'rect'); z.setAttribute('x', bb.x - .5); z.setAttribute('y', 30); z.setAttribute('width', bb.width + 1); z.setAttribute('height', 20); cp.appendChild(z); }
      svg.appendChild(cp); r.setAttribute('clip-path', 'url(#ptClip)');
    }
    const lead = .16;                                       // décalage entre les deux bords (part du temps)
    const go = run(OUT, (k) => {
      const kf = ease(Math.min(1, k / (1 - lead))), ks = ease(Math.max(0, (k - lead) / (1 - lead)));
      const fwd = dir !== 'left';
      const a = a0 + (a1 - a0) * (fwd ? ks : kf), b = b0 + (b1 - b0) * (fwd ? kf : ks);
      r.setAttribute('x', a.toFixed(2)); r.setAttribute('width', Math.max(0, b - a).toFixed(2));
    });
    return { dir, go };
  };

  // ---------- départ : on intercepte les liens vers les autres pages du site ----------
  let leaving = false; const passing = new WeakSet();
  const clean = (u) => { try { const x = new URL(u, location.href); return x.origin + x.pathname.replace(/\/$/, ''); } catch (e) { return ''; } };
  const KEYS = Object.keys(PAGES).reduce((o, u) => { o[clean(u)] = PAGES[u]; return o; }, {});
  document.addEventListener('click', (e) => {
    const a = e.target.closest && e.target.closest('a[href]'); if (!a || passing.has(a)) return;
    if (e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const dest = KEYS[clean(a.getAttribute('href'))]; if (!dest || dest.page === HERE) return;
    if (reduce) return;
    e.preventDefault(); e.stopPropagation(); if (leaving) return; leaving = true;
    if (a.closest('.jmenu, .jmt, .mos')) root.classList.add('pt-menu');   // depuis le menu mobile : la trame passe par-dessus
    const { dir, go } = slide(dest.page);
    field(dir || 'down'); root.classList.add('pt-run');
    const col = rgba(dest.bg);
    Promise.all([go, run(OUT, (k) => paint(ease(k) * 1.001, col, true))]).then(() => {
      passing.add(a);
      if (a.isConnected) a.click(); else { const b = document.createElement('a'); b.href = a.href; b.target = a.target || '_top'; document.body.appendChild(b); passing.add(b); b.click(); }
    });
  }, true);

  // ---------- arrivée : la page est couverte dès le <head>
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">, puis la trame se retire ----------
  const enter = (col) => { field('down'); root.classList.add('pt-run'); paint(0, col, false);
    root.classList.remove('pt-in');
    return run(IN, (k) => paint(ease(k), col, false)).then(() => { root.classList.remove('pt-run', 'pt-menu'); }); };
  const here = Object.values(PAGES).find((p) => p.page === HERE);
  if (root.classList.contains('pt-in') && here) {
    const go = () => requestAnimationFrame(() => enter(rgba(here.bg)));
    (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 400))]) : Promise.resolve()).then(go);
  }
  // retour arrière (page gardée en mémoire par le navigateur) : on enlève la trame restée posée
  addEventListener('pageshow', (e) => { if (!e.persisted || !leaving) return; leaving = false; location.reload(); });
})();
</script>
