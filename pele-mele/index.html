<style>
  /* Layout: an off-white board, panned and zoomed like a design canvas, with eleven sharp portfolio photos scattered loosely and nine blurred ones behind on two slower layers (parallax). Nav and HUD invert over whatever passes under them. Single light look. */
  /* PP Mori, fournie avec la page (dossier fonts/) */
  @font-face { font-family: "PP Mori"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/PPMori-Regular.woff2") format("woff2"); }
  @font-face { font-family: "PP Mori"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/PPMori-Semibold.woff2") format("woff2"); }
  @font-face { font-family: "PP Mori"; font-weight: 600; font-style: normal; font-display: swap; src: url("fonts/PPMori-Semibold.woff2") format("woff2"); }
  :root {
    --paper: #F2F0EB;   /* 6 nov. : blanc cassé, le même ton que le texte des pages noires */
    --ink: #000;
    --grot: "PP Mori", "Host Grotesk", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); font-family: var(--grot);
    overflow: hidden; overscroll-behavior: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }


  /* ---------- menu : le même que sur l'accueil, au pixel près (tracés de la maquette 1600 px, même colonne) ---------- */
  .jnav, .jlogo { position: fixed; z-index: 6000; top: 0; left: 0; right: 0; pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .jnav { mix-blend-mode: difference; }
  .jnav-in { position: relative; max-width: 1600px; margin: 0 auto; }
  .jnav svg { display: block; width: 100%; height: auto; aspect-ratio: 1600 / 84; }
  .jnav a, .jlogo a { position: absolute; display: block; pointer-events: auto; border-radius: 4px; }
  .jnav a:focus-visible { outline: 2px solid #F2F0EB; outline-offset: 4px; }

  /* ---------- le tableau : blanc, rien d'autre ---------- */
  .viewport { position: fixed; inset: 0; overflow: hidden; cursor: grab; touch-action: none; background: var(--paper); }
  .viewport.dragging { cursor: grabbing; }
  .viewport:focus-visible { outline: none; }
  .board { position: absolute; left: 0; top: 0; width: 4368px; height: 3136px; transform-origin: 0 0; will-change: transform; }
  /* 9 nov. (essai « nuée ») : trois plans de profondeur, comme la spirale du portfolio. Le plan du fond et celui du milieu
     glissent moins vite que le tableau (parallaxe) et sont flous ; au survol, une pièce revient au net. */
  .layer { position: absolute; left: 0; top: 0; width: 4368px; height: 3136px; transform-origin: 0 0; will-change: transform; pointer-events: none; }
  .board { pointer-events: none; }
  .board > *, .layer > * { pointer-events: auto; }
  .layer .it { transition: filter .5s ease, opacity .5s ease, scale .5s cubic-bezier(.2, .8, .2, 1); }
  .layer.far .it { filter: blur(var(--b, 8px)); opacity: .85; }
  .layer.mid .it { filter: blur(var(--b, 3px)); }
  .layer .it:hover { filter: blur(0); opacity: 1; scale: 1.06; outline: none; }
  .it.ph img { box-shadow: none; }

  .it { position: absolute; left: var(--x); top: var(--y); width: var(--w); margin: 0; }
  .it video { display: block; width: 100%; height: auto; pointer-events: none; }
  .it img { display: block; width: 100%; height: auto; max-width: none; user-select: none; -webkit-user-drag: none; }
  /* sélection façon outil de design : un filet noir, rien de plus */
  /* 9 nov. (galerie) : plus d'étiquettes ni de filet ; au survol, l'image avance à peine */
  .board .it { transition: scale .5s cubic-bezier(.2, .8, .2, 1); }
  .board .it:hover { scale: 1.02; }
  /* 9 nov. : entrée en scène — les photos sortent du flou une à une, comme une mise au point (l'ordre et les délais viennent du script) */
  .board .it { transition: scale .5s cubic-bezier(.2, .8, .2, 1), filter .9s cubic-bezier(.2, .7, .2, 1), opacity .7s ease; }
  .pre .it { opacity: 0 !important; filter: blur(16px) !important; scale: .96; }
  @media (prefers-reduced-motion: reduce) { .pre .it { opacity: 1 !important; filter: none !important; scale: 1; } }
  /* 9 nov. : clic sur une photo = mise au point : la caméra glisse jusqu'à elle, le reste du tableau passe au flou */
  .viewport.focus .board .it:not(.on) { filter: blur(7px); opacity: .45; }
  .viewport.focus .layer { opacity: .35; transition: opacity .7s ease; }
  .layer { transition: opacity .7s ease; }
  .board .it.on { scale: 1; }
  .board .it:not(.vid) { cursor: pointer; }
  .viewport.focus .board .it.on { cursor: pointer; }
  .viewport.dragging .board .it { cursor: grabbing; }

  /* ---------- interface : du texte, inversé lui aussi ---------- */
  .hud {
    position: fixed; z-index: 20; display: flex; gap: 1.1em; align-items: baseline;
    font: 400 calc(19.5 / 1600 * var(--fw)) / 1 var(--grot);   /* 9 nov. : exactement la taille du menu du haut (plus de plancher à 12 px, qui la grossissait sur un écran étroit) */ letter-spacing: -.01em; color: #F2F0EB; mix-blend-mode: difference;
    font-variant-numeric: tabular-nums;
    /* 9 nov. : calés sur la marge du site comme le pied de page des autres pages : le texte touche la marge à gauche et à droite,
       et en bas ce sont les descendantes qui la touchent (ligne de base = marge + .22em ; .15em = du bas de la ligne à la ligne de base) */
    bottom: calc(16px + .07em + env(safe-area-inset-bottom, 0px));
  }
  /* 9 nov. : trois repères sur la grille du site : le zoom en col. 1, x y en col. 2 (sous « pêle-mêle »), le nom du projet survolé à droite.
     Le zoom reste en col. 1 sur mobile aussi (x y y est masqué) : il ne change pas de place d'un écran à l'autre */
  .hud.l { left: max(16px, env(safe-area-inset-left, 0px)); }
  @media (max-width: 700px) { .hud { font-size: 15px; } }   /* mobile : la taille du menu mobile */
  .hud.z { left: max(16px, env(safe-area-inset-left, 0px)); gap: .9em; }
  @media (max-width: 700px) { .hud.l { display: none; } }   /* mobile : pas la place pour trois repères ; le zoom prend la col. 1, le nom garde la droite */
  .hud.r { right: max(16px, env(safe-area-inset-right, 0px)); }
  @media (min-width: 701px) {
    .hud { bottom: calc(100vw * var(--mr) + .07em + env(safe-area-inset-bottom, 0px)); }
    .hud.z { left: calc(100vw * var(--mr)); } .hud.r { right: calc(100vw * var(--mr)); }
    .hud.l { left: calc(var(--fl) + 363 / 1600 * var(--fw)); }
  }
  /* le nom du projet, comme la légende de la spirale du portfolio : les lettres se tapent en léger glitch, de droite à gauche */
  .pcap { pointer-events: none; white-space: nowrap; max-width: calc(100vw - 50% - 16px); transition: opacity .35s ease; }
  .pcap:not(.on) { opacity: 0; }
  /* 9 nov. : flou progressif sous le menu, propre au Pêle-mêle — le haut du tableau est « hors focus », comme les plans du fond.
     Cinq couches empilées (0,5 à 6 px, la version douce), chacune masquée un peu plus haut */
  .pblur { position: fixed; left: 0; right: 0; top: 0; height: calc(84 / 1600 * var(--fw) + 120px); z-index: 5999; pointer-events: none; }
  .pblur i { position: absolute; inset: 0; }
  .pblur i:nth-child(1) { -webkit-backdrop-filter: blur(.5px); backdrop-filter: blur(.5px); -webkit-mask-image: linear-gradient(#000 0%, #000 70%, transparent 100%); mask-image: linear-gradient(#000 0%, #000 70%, transparent 100%); }
  .pblur i:nth-child(2) { -webkit-backdrop-filter: blur(1px); backdrop-filter: blur(1px); -webkit-mask-image: linear-gradient(#000 0%, #000 50%, transparent 85%); mask-image: linear-gradient(#000 0%, #000 50%, transparent 85%); }
  .pblur i:nth-child(3) { -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); -webkit-mask-image: linear-gradient(#000 0%, #000 35%, transparent 66%); mask-image: linear-gradient(#000 0%, #000 35%, transparent 66%); }
  .pblur i:nth-child(4) { -webkit-backdrop-filter: blur(3.5px); backdrop-filter: blur(3.5px); -webkit-mask-image: linear-gradient(#000 0%, #000 20%, transparent 48%); mask-image: linear-gradient(#000 0%, #000 20%, transparent 48%); }
  .pblur i:nth-child(5) { -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); -webkit-mask-image: linear-gradient(#000 0%, #000 8%, transparent 32%); mask-image: linear-gradient(#000 0%, #000 8%, transparent 32%); }
  @media (max-width: 700px) { .pblur { height: 120px; } }
  /* 9 nov. : le même flou en bas, en miroir, sous les repères (qui restent nets : ils sont au niveau 20) */
  .pblur.b { top: auto; bottom: 0; z-index: 15; transform: scaleY(-1); }
  /* 9 nov. : à l'arrivée, rien derrière le menu ni les repères : deux caches couleur papier, retirés au premier mouvement du tableau */
  .pmask { position: fixed; left: 0; right: 0; top: 0; height: 0; z-index: 10; background: var(--paper); pointer-events: none; opacity: 0; transition: opacity .7s ease; }
  .pmask.b { top: auto; bottom: 0; height: auto; }
  .pmask.on { opacity: 1; transition: none; }
  .pcap .go { display: none; margin-left: 1.1em; color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; }
  .pcap .go:hover { text-decoration-thickness: 2px; }
  .pcap.f { pointer-events: auto; }
  .pcap.f .go { display: inline; }
  @media (max-width: 700px) { .pcap.f { flex-direction: column; align-items: flex-end; gap: .4em; } .pcap .go { margin-left: 0; } }
  @media (max-width: 700px) { .pcap { white-space: normal; text-align: right; line-height: 1.25; max-width: calc(100vw - 16px - 2 * var(--mc, 74px)); } }   /* mobile : un nom long passe sur deux lignes au lieu de déborder sur le zoom */
  .pcap .g { opacity: 0; }
  .pcap .g.x { opacity: .45; }
  .pcap .g.in { opacity: 1; transition: opacity .3s cubic-bezier(.23, 1, .32, 1); }
  @media (prefers-reduced-motion: reduce) { .pcap .g { opacity: 1; } }
  .hud button { position: relative; font: inherit; letter-spacing: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .hud button::after { content: ""; position: absolute; inset: -14px -.45em; }   /* la zone de clic reste généreuse, sans décaler le texte */
  .hud button:hover { text-decoration: underline; text-underline-offset: .2em; text-decoration-thickness: 1px; }
  .hud button:focus-visible { outline: 1px solid currentColor; outline-offset: 3px; }
</style>

<script>
(() => {
  const BW = 4368, BH = 3136;
  const vp = document.getElementById('vp'), board = document.getElementById('board');
  const coords = document.getElementById('coords'), zReset = document.getElementById('zReset');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // caméra : coin haut-gauche de l'écran, en coordonnées du tableau, et zoom
  const cam = { x: 0, y: 0, z: 1 };
  const LAYERS = [...document.querySelectorAll('.layer')].map((el) => [el, parseFloat(el.dataset.p)]);
  const drift = { x: 0, y: 0 }, dtg = { x: 0, y: 0 }; let draf = 0;
  if (!reduce && matchMedia('(hover: hover)').matches) addEventListener('pointermove', (e) => {
    dtg.x = (innerWidth / 2 - e.clientX) / (innerWidth / 2); dtg.y = (innerHeight / 2 - e.clientY) / (innerHeight / 2);
    if (!draf) { const step = () => { drift.x += (dtg.x - drift.x) * .06; drift.y += (dtg.y - drift.y) * .06; render();
      draf = Math.abs(dtg.x - drift.x) + Math.abs(dtg.y - drift.y) > .002 ? requestAnimationFrame(step) : 0; }; draf = requestAnimationFrame(step); }
  });
  let vx = 0, vy = 0, anim = null;
  const clampZ = (z) => Math.max(0.15, Math.min(3, z));
  const clampCam = () => {
    const w = innerWidth / cam.z, h = innerHeight / cam.z, m = 300;
    cam.x = Math.max(-m - Math.max(0, w - BW) / 2, Math.min(BW - w + m * 2, cam.x));   // un peu plus de jeu à droite : sur un petit écran, la vue de départ doit pouvoir cacher la vidéo à gauche
    cam.y = Math.max(-m - Math.max(0, h - BH) / 2, Math.min(BH - h + m, cam.y));
  };
  const render = () => {
    clampCam();
    if (startCam && (Math.abs(cam.x - startCam.x) + Math.abs(cam.y - startCam.y)) * cam.z + Math.abs(cam.z - startCam.z) * 400 > 2) unmask();
    board.style.transform = `scale(${cam.z}) translate(${-cam.x}px, ${-cam.y}px)`;
    // les plans du fond : ils glissent moins vite (facteur p) autour du centre du tableau, et dérivent un peu avec la souris
    const Cx = cam.x + innerWidth / cam.z / 2, Cy = cam.y + innerHeight / cam.z / 2;
    LAYERS.forEach(([el, p]) => {
      const lx = BW / 2 + (Cx - BW / 2) * p, ly = BH / 2 + (Cy - BH / 2) * p;
      el.style.transform = `translate(${innerWidth / 2 + drift.x * (1 - p) * 40}px, ${innerHeight / 2 + drift.y * (1 - p) * 40}px) scale(${cam.z}) translate(${-lx}px, ${-ly}px)`;
    });
    vp.style.setProperty('--z', cam.z);
    const cx = Math.round(cam.x + innerWidth / cam.z / 2), cy = Math.round(cam.y + innerHeight / cam.z / 2);
    coords.textContent = `x ${cx}  y ${cy}`;
    zReset.textContent = Math.round(cam.z * 100) + ' %';
  };
  const zoomAt = (z, sx, sy) => {   // zoome en gardant le point (sx, sy) de l'écran immobile
    const nz = clampZ(z), bx = cam.x + sx / cam.z, by = cam.y + sy / cam.z;
    cam.z = nz; cam.x = bx - sx / nz; cam.y = by - sy / nz; render();
  };
  const flyTo = (tx, ty, tz, ms = 650) => {
    cancelAnimationFrame(anim); vx = vy = 0;
    const s = { ...cam }, t0 = performance.now(), d = reduce ? 1 : ms;
    const e = (t) => 1 - Math.pow(1 - t, 3);
    const step = (now) => {
      const k = e(Math.min(1, (now - t0) / d));
      cam.x = s.x + (tx - s.x) * k; cam.y = s.y + (ty - s.y) * k; cam.z = s.z + (tz - s.z) * k; render();
      if (k < 1) anim = requestAnimationFrame(step);
    };
    anim = requestAnimationFrame(step);
  };
  const centerOn = (bx, by, z) => flyTo(bx - innerWidth / z / 2, by - innerHeight / z / 2, z);

  // vue de départ : le milieu de la galerie, quatre ou cinq images de large ; elles débordent des bords
  const start = () => {
    // 9 nov. : on ne voit pas la vidéo en arrivant ; elle attend 30 px à gauche de l'écran, à mi-hauteur :
    // le premier petit glissement vers la droite la découvre, comme une surprise
    const mob = innerWidth < 640;
    cam.z = clampZ(mob ? innerWidth / 820 : Math.min(innerWidth / 2450, innerHeight / 1630));   // 9 nov. : un peu plus loin, le tableau ayant plus d'air
    const vf = board.querySelector('.it.vid'), vx0 = parseFloat(vf.style.getPropertyValue('--x')), vy0 = parseFloat(vf.style.getPropertyValue('--y')), vw = parseFloat(vf.style.getPropertyValue('--w'));
    cam.x = vx0 + vw + 30 / cam.z;
    cam.y = vy0 + vw * 794 / 640 / 2 - innerHeight * .45 / cam.z;
    clear(vx0 + vw); render();
  };
  // 9 nov. : à l'arrivée, rien derrière le menu ni derrière les repères du bas. On essaie de petits décalages autour de la vue
  // de départ (jamais vers la gauche : le piano doit rester caché) et on garde le plus proche qui laisse les deux bandes vides,
  // vignettes floues comprises (avec leur parallaxe et une marge pour leur dérive à la souris). Sinon, celui qui en cache le moins.
  const clear = (vidRight) => {
    const nav = [...document.querySelectorAll(innerWidth <= 700 ? '.mnav a, .mnav button, .jlogo a' : '.jnav a')].map((a) => a.getBoundingClientRect()).filter((r) => r.height > 0 && r.top < 200);
    const top = (nav.length ? Math.max(...nav.map((r) => r.bottom)) : 70) + 18;
    // la ligne du bas : marge du site + une ligne de repères + 18 px d'air (calculé, la mesure n'est pas fiable pendant la transition de page)
    const hfs = parseFloat(getComputedStyle(document.querySelector('.hud')).fontSize) || 14;
    const bot = innerHeight - (innerWidth > 700 ? innerWidth * .016 : 16) - hfs * 1.3 - 18;
    const items = [];
    board.querySelectorAll('.it').forEach((it) => items.push([it, 1, 0]));
    LAYERS.forEach(([el, p]) => el.querySelectorAll('.it').forEach((it) => items.push([it, p, 24])));
    const geo = items.map(([it, p, pad]) => [parseFloat(it.style.getPropertyValue('--x')), parseFloat(it.style.getPropertyValue('--y')), it.offsetWidth, it.offsetHeight, p, pad]);
    const z = cam.z, W = innerWidth, H = innerHeight;
    const cost = (cx0, cy0) => {
      const Cx = cx0 + W / z / 2, Cy = cy0 + H / z / 2; let c = 0;
      for (const [x, y, w, h, p, pad] of geo) {
        let sx, sy;
        if (p === 1) { sx = (x - cx0) * z; sy = (y - cy0) * z; }
        else { sx = W / 2 + (x - (BW / 2 + (Cx - BW / 2) * p)) * z; sy = H / 2 + (y - (BH / 2 + (Cy - BH / 2) * p)) * z; }
        const l = sx - pad, r = sx + w * z + pad, t = sy - pad, b = sy + h * z + pad;
        if (r < 0 || l > W) continue;
        const ox = Math.min(r, W) - Math.max(l, 0);
        c += ox * (Math.max(0, Math.min(b, top) - Math.max(t, 0)) + .15 * Math.max(0, Math.min(b, H) - Math.max(t, bot)));   // le menu d'abord ; le bas compte moins
      }
      return c;
    };
    // grille de décalages : jusqu'à 600 px vers la droite et 300 px en haut ou en bas ; on garde la vue la plus propre, puis la plus proche
    const base = { ...cam }; let best = null;
    for (let dx = 0; dx <= 20; dx++) for (let dy = -10; dy <= 10; dy++) {
      cam.x = base.x + dx * 30 / z; cam.y = base.y + dy * 30 / z; clampCam();
      if ((vidRight - cam.x) * z > -8) continue;   // le piano doit rester hors de l'écran
      const c = cost(cam.x, cam.y), d = Math.hypot(dx, dy);
      if (!best || c < best.c - 1 || (Math.abs(c - best.c) <= 1 && d < best.d)) best = { c, d, x: cam.x, y: cam.y };
    }
    if (best) { cam.x = best.x; cam.y = best.y; } else { cam.x = base.x; cam.y = base.y; }
    // ce qui touche encore les bandes est voilé par deux caches couleur papier, jusqu'au premier mouvement du tableau
    mTop.style.height = top + 'px'; mBot.style.top = bot + 'px';
    if (best && best.c > 0) { mTop.classList.add('on'); mBot.classList.add('on'); startCam = { x: cam.x, y: cam.y, z: cam.z }; }
  };
  const mTop = document.getElementById('pmTop'), mBot = document.getElementById('pmBot');
  let startCam = null;
  const unmask = () => { if (!startCam) return; startCam = null; mTop.classList.remove('on'); mBot.classList.remove('on'); };

  // glisser pour se déplacer, avec élan ; pincer pour zoomer
  const pts = new Map(); let last = null, pinch = null;
  vp.addEventListener('pointerdown', (e) => {
    vp.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    cancelAnimationFrame(anim); vx = vy = 0;
    last = { t: performance.now() };
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), z: cam.z }; }
    vp.classList.add('dragging');
  });
  vp.addEventListener('pointermove', (e) => {
    if (!pts.has(e.pointerId)) return;
    const p = pts.get(e.pointerId); const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 2 && pinch) {
      const [a, b] = [...pts.values()];
      zoomAt(pinch.z * Math.hypot(a.x - b.x, a.y - b.y) / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2);
      return;
    }
    cam.x -= dx / cam.z; cam.y -= dy / cam.z;
    const now = performance.now(), dt = Math.max(1, now - last.t);
    vx = 0.8 * (dx / dt) + 0.2 * vx; vy = 0.8 * (dy / dt) + 0.2 * vy; last.t = now;
    render();
  });
  const up = (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
    if (pts.size) return;
    vp.classList.remove('dragging');
    if (reduce || performance.now() - last.t > 80) return;
    let px = vx * 16, py = vy * 16;
    const glide = () => {
      px *= 0.93; py *= 0.93; cam.x -= px / cam.z; cam.y -= py / cam.z; render();
      if (Math.abs(px) + Math.abs(py) > 0.3) anim = requestAnimationFrame(glide);
    };
    anim = requestAnimationFrame(glide);
  };
  vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);

  // molette / pavé : on se déplace ; avec Ctrl ou ⌘ (ou pincement du pavé), on zoome
  vp.addEventListener('wheel', (e) => {
    e.preventDefault(); cancelAnimationFrame(anim);
    if (e.ctrlKey || e.metaKey) zoomAt(cam.z * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
    else { cam.x += e.deltaX / cam.z; cam.y += e.deltaY / cam.z; render(); }
  }, { passive: false });

  // double-clic : cadre l'élément visé (ou zoome sur le point)
  vp.addEventListener('dblclick', (e) => {
    const it = e.target.closest('.it');
    if (it) return;   // 9 nov. : sur une photo, le simple clic fait déjà la mise au point
    else {
      const bx = cam.x + e.clientX / cam.z, by = cam.y + e.clientY / cam.z; centerOn(bx, by, clampZ(cam.z * 1.6));
    }
  });

  // clavier : flèches pour se déplacer, + − 0 pour le zoom
  const mid = () => [innerWidth / 2, innerHeight / 2];
  vp.addEventListener('keydown', (e) => {
    const s = 140 / cam.z;
    const k = { ArrowLeft: [-s, 0], ArrowRight: [s, 0], ArrowUp: [0, -s], ArrowDown: [0, s] }[e.key];
    if (k) { e.preventDefault(); flyTo(cam.x + k[0], cam.y + k[1], cam.z, 260); }
    else if (e.key === '+' || e.key === '=') zoomAt(cam.z * 1.25, ...mid());
    else if (e.key === '-') zoomAt(cam.z / 1.25, ...mid());
    else if (e.key === '0') zoomAt(1, ...mid());
  });
  document.getElementById('zIn').onclick = () => zoomAt(cam.z * 1.25, ...mid());
  document.getElementById('zOut').onclick = () => zoomAt(cam.z / 1.25, ...mid());
  zReset.onclick = () => zoomAt(1, ...mid());


  // 9 nov. : le nom du projet au survol (au toucher sur mobile), en bas à droite, avec l'effet de lettres de la spirale :
  // les dernières lettres changent à sec, ce qui dépasse apparaît de droite à gauche, un signe au hasard puis la vraie lettre
  const cap = document.getElementById('pcap'), capNm = cap.querySelector('.nm');
  const GL = 'abcdefghijklmnopqrstuvwxyz0123456789#%&*+=/<>';
  const typeCap = (el, to) => {
    const from = el.__txt || '', tok = (el.__tok || 0) + 1; el.__tok = tok; el.__txt = to;
    if (reduce) { el.textContent = to; return; }
    const keep = Math.min(from.length, to.length), extra = to.length - keep;
    el.textContent = '';
    for (let i = 0; i < extra; i++) {
      const c = to[i], g = document.createElement('span'); g.className = 'g'; g.textContent = c; el.appendChild(g);
      if (c === ' ') { g.classList.add('in'); continue; }
      const d = (extra - 1 - i) * 22;
      setTimeout(() => { if (el.__tok !== tok) return; g.textContent = GL[Math.random() * GL.length | 0]; g.classList.add('x'); }, d);
      setTimeout(() => { if (el.__tok !== tok) return; g.textContent = c; g.classList.remove('x'); g.classList.add('in'); }, d + 70);
    }
    el.append(to.slice(extra));
  };

<!-- grille de mise en page (5 colonnes de 278, gouttières de 20, marges de 65, sur 1600) : cachée ; touche G pour l'afficher ou la cacher -->
<style>
  .jgrid { position: fixed; inset: 0; z-index: 99999; pointer-events: none; opacity: 0; visibility: hidden; transition: opacity .35s ease, visibility 0s .35s;

<script>
/* 13 nov. : le texte passe au gris en montant vers le menu, au lieu du dégradé noir.
   Grosse typo : phrase par phrase. Petite typo : paragraphe par paragraphe. Le groupe bascule d'un coup (fondu de couleur, léger balayage mot à mot),
   au lieu d'un dégradé recalculé à chaque image : plus fluide.
   Seul le texte qui défile avec la page est touché : ni le menu, ni les éléments fixes ou collants, ni les images. */
(() => {
  if (document.getElementById('scene')) { document.documentElement.classList.add('pf'); return; }   // portfolio : on garde le dégradé, pas d'effet sur le texte
  const MID = 130, TOP = 80;   // gris quand le milieu du groupe passe à 130 px du haut, ou son haut à 80 px (13 nov. : plus près du menu)
  const BIG = 21;               // px : au-dessus, on découpe par phrase ; en dessous, par paragraphe
  const SKIP = '.mur, .jnav, .hnav, .mnav, .jlogo, .jfoot, .jcopy, .gm, .lb, #lb, #scene, #os, .os, .pt-veil, .brk-fall, script, style, noscript, svg, button, [aria-hidden="true"]:not(.tw-ok)';
  const END = /[.!?…][»"”’')\]]*$/;   // fin de phrase
  let words = [], groups = [], ready = false, gid = 0;
  const pinned = (el) => { for (let n = el; n && n !== document.body; n = n.parentElement) { const p = getComputedStyle(n).position; if (p === 'fixed' || p === 'sticky') return true; } return false; };
  // le bloc (paragraphe) d'un texte : le premier parent qui n'est pas en ligne ; les lignes enroulées de l'accueil (.ln) ne comptent pas
  const blockOf = (el, root) => { for (let n = el; n && n !== root; n = n.parentElement) { if (n.classList.contains('ln')) continue; const d = getComputedStyle(n).display; if (!d.startsWith('inline') && d !== 'contents') return n; } return root; };
  const wrap = () => {
    const main = document.querySelector('main') || document.body;
    const tw = document.createTreeWalker(main, NodeFilter.SHOW_TEXT, { acceptNode: (t) => {
      if (!t.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const el = t.parentElement; if (!el || el.closest(SKIP) || el.classList.contains('tw')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT; } });
    const list = []; while (tw.nextNode()) list.push(tw.currentNode);
    const cache = new Map(), blocks = new Map();
    list.forEach((t) => {
      const host = t.parentElement;
      let ok = cache.get(host); if (ok === undefined) { ok = !pinned(host); cache.set(host, ok); }
      if (!ok) return;
      const blk = blockOf(host, main);
      let st = blocks.get(blk);
      if (!st) blocks.set(blk, st = { big: parseFloat(getComputedStyle(blk).fontSize) >= BIG, g: ++gid, cut: false });
      const f = document.createDocumentFragment();
      t.nodeValue.split(/(\s+)/).forEach((w) => {
        if (!w) return; if (/^\s+$/.test(w)) { f.appendChild(document.createTextNode(w)); return; }
        if (st.cut) { st.g = ++gid; st.cut = false; }
        const s = document.createElement('span'); s.className = 'tw'; s.textContent = w; s.dataset.g = st.g; f.appendChild(s);
        if (st.big && END.test(w)) st.cut = true;
      });
      t.replaceWith(f);
    });
    words = [...document.querySelectorAll('.tw')];
  };
  // si une page reconstruit son texte (l'intro de l'accueil, au redimensionnement), on enveloppe de nouveau
  let mo = null, mt = 0;
  const rewrap = () => { mo && mo.disconnect(); wrap(); measure(); mo && mo.observe(document.querySelector('main') || document.body, { childList: true, subtree: true }); };
  const measure = () => {
    const by = new Map();
    // position dans la page sans les transformations (les lignes de l'accueil s'enroulent en 3D en haut de l'écran : on garde leur place d'origine)
    const docTop = (el) => { let t = 0; for (let n = el; n; n = n.offsetParent) t += n.offsetTop; return t; };
    words = words.filter((w) => w.isConnected);
    words.forEach((w) => {

      if (!g) by.set(w.dataset.g, g = { top: t, bot: b, els: [], on: null, live: !!w.closest('.intro .ln') });   // live : lignes enroulées, on suit leur place à l'écran
      g.top = Math.min(g.top, t); g.bot = Math.max(g.bot, b); g.els.push(w);
    });
    groups = [...by.values()];
    groups.forEach((g) => { const n = g.els.length, step = Math.min(5, 90 / n); g.els.forEach((e, i) => e.style.setProperty('--d', Math.round(i * step) + 'ms')); });   // balayage : 90 ms au plus pour tout le groupe
    paint(true);
  };
  const paint = (force) => {
    const y = scrollY;
    for (const g of groups) {
      let top, bot;
      if (g.live) { top = g.els[0].getBoundingClientRect().top; bot = g.els[g.els.length - 1].getBoundingClientRect().bottom; }
      else { top = g.top - y; bot = g.bot - y; }
      const on = top < TOP || (top + bot) / 2 < MID;
      if (on !== g.on || force) { g.on = on; for (const e of g.els) e.classList.toggle('gr', on); }
    }

  const onScroll = () => { if (!ready) return; paint(false); clearTimeout(idle); idle = setTimeout(measure, 250); };
  const start = () => { if (ready) return; wrap(); measure(); ready = true;
    mo = new MutationObserver((ms) => { if (ms.some((m) => [...m.addedNodes].some((n) => n.nodeType === 3 ? n.nodeValue.trim() && !n.parentElement?.classList.contains('tw') : n.nodeType === 1 && !n.classList.contains('tw')))) { clearTimeout(mt); mt = setTimeout(rewrap, 120); } });
    mo.observe(document.querySelector('main') || document.body, { childList: true, subtree: true }); };
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', () => { if (ready) { clearTimeout(idle); idle = setTimeout(measure, 150); } });
  const go = () => setTimeout(() => { start(); (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(measure, 50)); }, 250);
  if (document.readyState === 'complete') go(); else addEventListener('load', go);
  if ('ResizeObserver' in window) new ResizeObserver(() => { if (ready) { clearTimeout(idle); idle = setTimeout(measure, 150); } }).observe(document.body);
})();
</script>

    return run(IN, (k) => paint(ease(k), col, false)).then(() => { root.classList.remove('pt-run', 'pt-menu'); }); };
  const here = Object.values(PAGES).find((p) => p.page === HERE);
  if (root.classList.contains('jmt-arrive')) root.classList.remove('pt-in');   // 14 nov. : arrivée par le menu : c'est lui qui fait la transition
  else if (root.classList.contains('pt-in') && here) {
    const go = () => requestAnimationFrame(() => enter(rgba(here.bg)));
    (document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 400))]) : Promise.resolve()).then(go);
  }
  // retour arrière (page gardée en mémoire par le navigateur) : on enlève la trame restée posée
  addEventListener('pageshow', (e) => { if (!e.persisted || !leaving) return; leaving = false; location.reload(); });
})();
</script>
